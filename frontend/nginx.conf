server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Chat and search routes → chat service (loads TextVectorizer + LLM)
    location /api/chat/ {
        proxy_pass http://chat:5001/api/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Required for SSE streaming
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/searching {
        proxy_pass http://chat:5001/api/searching;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # All other /api/ routes → api service (CRUD, no ML)
    location /api/ {
        proxy_pass http://backend-app:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve .mjs files as JavaScript — nginx alpine may not include mjs in
    # its default mime.types, causing browsers to reject ES module workers.
    location ~* \.mjs$ {
        types {}
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
