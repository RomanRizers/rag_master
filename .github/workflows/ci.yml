name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  python-unit:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Run Python tests
        run: uv run python -m unittest discover -s tests -v

  frontend:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  go-integration:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Start backend
        env:
          QDRANT_URL: http://127.0.0.1:9
          STORAGE_BACKEND: local
          DOCUMENTS_STORAGE_PATH: /tmp/rag_documents
          LLM_PROVIDER: openrouter
          OPENROUTER_BASE_URL: http://127.0.0.1:9/v1
          OPENROUTER_MODEL: ci-placeholder
          OPENROUTER_API_KEY: ci-placeholder
          HEALTHCHECK_LLM_ACTIVE_PROBE: "0"
        run: |
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 5001 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start in time"
          cat /tmp/backend.log
          exit 1

      - name: Run Go integration tests
        env:
          RAG_API_BASE_URL: http://127.0.0.1:5001
        run: go test ./tests -v

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/backend.log

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi
