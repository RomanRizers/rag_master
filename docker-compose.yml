services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-app
    networks:
      - qdrant-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6334:6333"
    volumes:
      - ./qdrant_collections/collections:/qdrant/storage/collections
    environment:
      - QDRANT_HTTP_PORT=6333
      - QDRANT_GRPC_PORT=6335
    networks:
      - qdrant-network

  backend-app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: backend
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
      - documents-storage:/tmp/rag_documents
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - DOCUMENTS_STORAGE_PATH=${DOCUMENTS_STORAGE_PATH:-/tmp/rag_documents}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-rag-documents}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_AUTO_CREATE_BUCKET=${S3_AUTO_CREATE_BUCKET:-1}
    depends_on:
      - qdrant
      - minio
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 5000
    networks:
      - qdrant-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - qdrant-network

networks:
  qdrant-network:
    driver: bridge

volumes:
  hf-cache:
  documents-storage:
  minio-data:
