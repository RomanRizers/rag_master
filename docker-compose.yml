services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-app
    networks:
      - qdrant-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6334:6333"
    volumes:
      - ./qdrant_collections/collections:/qdrant/storage/collections
    environment:
      - QDRANT_HTTP_PORT=6333
      - QDRANT_GRPC_PORT=6335
    networks:
      - qdrant-network

  backend-app:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: backend
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
    depends_on:
      - qdrant
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 5000
    networks:
      - qdrant-network

networks:
  qdrant-network:
    driver: bridge

volumes:
  hf-cache:
