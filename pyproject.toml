[project]
name = "rag-master"
version = "0.1.0"
description = "Paragraph search service based on FastAPI + Qdrant + E5 embeddings"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "jinja2",
    "pandas",
    "qdrant-client",
    "torch",
    "torchaudio",
    "torchvision",
    "tqdm",
    "transformers",
    "uvicorn",
]

[tool.uv]
package = false
